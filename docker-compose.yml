version: "3.9"

services:
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - API_DATA_DIR=forecasting-product/data/
      - API_METRICS_DIR=forecasting-product/data/metrics/
      - AUTH_ENABLED=true
      - API_DEV_MODE=false
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
    volumes:
      - api-data:/app/forecasting-product/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

  frontend:
    build:
      context: ./forecasting-product/frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

volumes:
  api-data:
