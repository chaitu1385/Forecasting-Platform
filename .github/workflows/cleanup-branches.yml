name: Cleanup merged branch

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: "One merged PR whose unchanged head branch should be inspected"
        required: true
        type: string
      dry_run:
        description: "Inspect only; explicitly uncheck to allow conditional deletion"
        required: true
        default: true
        type: boolean

concurrency:
  group: cleanup-merged-branch-${{ inputs.pull_number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Inspect or delete one merged PR branch
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Never execute code from the PR head being considered for deletion.
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify live eligibility and conditionally delete
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pull_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { cleanupMergedBranch } = require("./.github/scripts/cleanup-merged-branch.cjs");
            await cleanupMergedBranch({
              github, context, core,
              pullNumber: process.env.PR_NUMBER,
              dryRun: process.env.DRY_RUN,
            });
