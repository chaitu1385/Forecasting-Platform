name: Controlled science tuple evidence

on:
  push:
    branches: [chaitu1385-phase-v-numeric-evidence-24acd807]

permissions:
  contents: read

jobs:
  comparison:
    name: Controlled tuple comparison (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11.18"
            profile: py311
          - os: ubuntu-24.04
            python: "3.12.16"
            profile: py312
          - os: windows-2025
            python: "3.11.18"
            profile: py311
          - os: windows-2025
            python: "3.12.16"
            profile: py312
    env:
      POLARS_MAX_THREADS: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: runner.os == 'Linux'
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: forecasting-product/requirements/**/*.txt
      - name: Provision exact native Windows security-release Python
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/forecast-python
          UV_CACHE_DIR: ${{ runner.temp }}/forecast-uv-cache
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'forecast-uv.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'forecast-uv'
          Invoke-WebRequest 'https://github.com/astral-sh/uv/releases/download/0.13.6/uv-x86_64-pc-windows-msvc.zip' -OutFile $archive
          $expected = 'a2a8820d5eea32f08ef467ef3b7f66883a9b076d5737a2fc2fbb5f458d1bb50f'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'The uv archive does not match the pinned upstream SHA256'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          $uv = Join-Path $tools 'uv.exe'
          & $uv python install '${{ matrix.python }}' --no-bin --no-registry
          if ($LASTEXITCODE -ne 0) { throw 'Managed Python installation failed' }
          $python = & $uv python find '${{ matrix.python }}' --managed-python
          if ($LASTEXITCODE -ne 0) { throw 'Managed Python lookup failed' }
          $venv = Join-Path $env:RUNNER_TEMP 'forecast-runtime'
          & $python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Python environment creation failed' }
          $scripts = Join-Path $venv 'Scripts'
          & (Join-Path $scripts 'python.exe') -c "import platform, sysconfig; assert platform.python_version() == '${{ matrix.python }}'; assert platform.machine().lower() in ('amd64', 'x86_64'); assert sysconfig.get_platform() == 'win-amd64'"
          if ($LASTEXITCODE -ne 0) { throw 'The native interpreter does not match the qualified target' }
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install current supported experiment tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r forecasting-product/requirements/${{ matrix.profile }}/dev.txt
      - name: Capture controlled numerical tuple evidence
        working-directory: forecasting-product
        run: python scripts/controlled_science_evidence.py --output "${{ runner.temp }}/controlled-science/reports"
      - name: Upload evidence only, never dependency caches
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controlled-science-${{ matrix.os }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/controlled-science/reports/
