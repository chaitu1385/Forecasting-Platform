name: Controlled science tuple evidence

on:
  push:
    branches: [chaitu1385-phase-v-numeric-evidence-24acd807]

permissions:
  contents: read

jobs:
  comparison:
    name: Controlled tuple comparison (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11.18"
            profile: py311
          - python: "3.12.16"
            profile: py312
    env:
      POLARS_MAX_THREADS: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: forecasting-product/requirements/**/*.txt
      - name: Install current supported experiment tooling
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r forecasting-product/requirements/${{ matrix.profile }}/dev.txt
      - name: Capture controlled numerical tuple evidence
        working-directory: forecasting-product
        run: python scripts/controlled_science_evidence.py --output "${{ runner.temp }}/controlled-science/reports"
      - name: Upload evidence only, never dependency caches
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controlled-science-${{ matrix.profile }}
          path: ${{ runner.temp }}/controlled-science/reports/
