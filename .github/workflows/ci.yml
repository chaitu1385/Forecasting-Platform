name: CI

on:
  push:
    branches: [master, main, 'claude/**', 'copilot/**']
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check forecasting-product/src/

  validation:
    name: Forecast validation (Polars ${{ matrix.polars }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        polars: ["0.20.0", "2.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: forecasting-product/pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install \
            "numpy>=1.21.0" \
            "pandas>=1.3.0" \
            "polars==${{ matrix.polars }}" \
            "pyyaml>=5.4.0" \
            "pytest>=7.0.0"

      - name: Run validation regressions
        working-directory: forecasting-product
        run: |
          python -m pytest \
            tests/test_forecast_validation.py \
            tests/test_validation_integration.py \
            tests/test_pipeline_manifest.py \
            -q -o addopts="" \
            -o faulthandler_timeout=60 \
            -p no:cacheprovider \
            --junitxml=validation-results.xml

      - name: Run multi-horizon regressions
        if: matrix.polars == '2.0.0'
        working-directory: forecasting-product
        run: |
          python -m pytest \
            tests/test_multi_horizon.py \
            -q -o addopts="" \
            -o faulthandler_timeout=60 \
            -p no:cacheprovider \
            --junitxml=multi-horizon-results.xml

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results-polars-${{ matrix.polars }}
          path: |
            forecasting-product/validation-results.xml
            forecasting-product/multi-horizon-results.xml

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: forecasting-product/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r forecasting-product/requirements.txt
          pip install pytest pytest-cov httpx rapidfuzz

      - name: Run tests
        working-directory: forecasting-product
        run: |
          python -m pytest \
            -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: forecasting-product/coverage.xml

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --target api \
            -t forecasting-product:${{ github.sha }} \
            .

      - name: Verify image runs
        run: |
          docker run --rm -d \
            --name fp-smoke \
            -p 8000:8000 \
            forecasting-product:${{ github.sha }}
          sleep 5
          curl -sf http://localhost:8000/health || (docker logs fp-smoke && exit 1)
          docker stop fp-smoke

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: forecasting-product/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: forecasting-product/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:e2e
      - run: npm run build
